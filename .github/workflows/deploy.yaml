name: Deploy

# CD for learn.cogitave.com. Builds the static site + the JSON/MCP/llms.txt
# projections, then PUBLISHES behind a GitHub Environment protection gate. Per
# AGENTS.md rules 6-7 and deployment-and-delivery.md, no agent self-promotes to
# prod: the `production` environment requires a human reviewer + wait timer, and
# `apply`/`release`/`deploy` are the always-human verb ceiling.
#
# Delivery model: GitOps (Argo CD / Flux pull-reconcile) is the estate default;
# this push-flow is the fallback and the uniform place the health gate + change
# evidence live. It mirrors the reusable workflow at
# cogitave/.github/.github/workflows/cd.yml (ADR-0017).
#
# `.yaml` on purpose (estate-lint check_learnpr). Pin actions to SHA at cutover.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target: staging | production. Drives GitHub Environment protection (production = required reviewers + wait timer)."
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the publishable bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site + _api + llms.txt (validation gates enforced)
        run: node tools/build.mjs --out _site
      # Every projection - _api/, llms.txt, llms-full.txt, search-index.json -
      # is emitted INSIDE _site/, so one path carries the whole bundle. Listing
      # them separately uploaded nothing and warned instead of failing.
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: learn-site-${{ github.sha }}
          path: _site/
          if-no-files-found: error

  publish:
    name: Publish (human-gated)
    needs: build
    runs-on: ubuntu-latest
    # The gate: this GitHub Environment carries the required-reviewer + wait-timer
    # protection. The job cannot start until a human approves. This is the
    # merge/apply/release ceiling from AGENTS.md rules 6-7, enforced by construction.
    environment: ${{ inputs.environment }}
    steps:
      # The tree is needed as well as the artifact: `functions/` is compiled by
      # wrangler from the project root, not from the uploaded directory. That is
      # how /mcp ships inside the same deployment as the pages it describes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: learn-site-${{ github.sha }}
          path: _site

      # Cloudflare Pages, Direct Upload. NOT the Cloudflare Git integration: the
      # build runs in our own pipeline and we upload the artifact, so no
      # third-party gets a repo access grant and the supply chain stays ours
      # (infra/cloudflare/edge/main.tf carries the same reasoning).
      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ inputs.environment == 'production' && 'main' || 'staging' }}
            --commit-hash=${{ github.sha }}

      # A deploy that returns 200 for the homepage and a broken /mcp is a broken
      # deploy. The health gate asserts both surfaces of the SAME upload, so a
      # green run means the artifact actually serves - not merely that it copied.
      - name: Health gate
        env:
          BASE: ${{ inputs.environment == 'production' && 'https://learn.cogitave.com' || steps.publish.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "probing $BASE"

          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/")
          test "$code" = "200" || { echo "::error::homepage returned $code"; exit 1; }

          # MCP must answer server/discover (the stateless 2026-07-28 entry point), not just exist.
          body=$(curl -sS -X POST "$BASE/mcp" \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover"}')
          echo "$body" | grep -q '"2026-07-28"' \
            || { echo "::error::/mcp did not answer server/discover: $body"; exit 1; }

          # And it must actually be able to read the corpus it shipped with.
          hits=$(curl -sS -X POST "$BASE/mcp" \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"docs_search","arguments":{"query":"agent","topK":1}}}')
          echo "$hits" | grep -q '"uid"' \
            || { echo "::error::/mcp served an empty corpus: $hits"; exit 1; }

          echo "health gate passed: site + /mcp both serving"
