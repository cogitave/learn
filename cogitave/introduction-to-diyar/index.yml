title: "Introduction to Cogitave Diyar"
summary: |
  Diyar is Cogitave's edge-autonomous platform for operating regulated field devices, where the device stays the sole authority over safety and evidence and each industry ships as a signed, pluggable solution. Understand what Diyar is, why safety and evidence stay local to the device, and how a device becomes a solution through signed profiles, verdict engines, and app packages.
prerequisites: |
  - General familiarity with distributed systems or industrial/IoT devices is helpful.
  - No prior Cogitave or Rust experience required.
