title: Contributor onboarding
summary: |
  The fast start for everyone who joins Cogitave: apply the non-negotiable AGENTS floor, inherit a repository's complete ruleset through the project baseline, work the propose-only request lifecycle, and open your first signed, Conventional-Commit pull request. This is the Tier-0 entry point every role track builds on. Day 0: this path is scaffolded - the module bodies are authored in a later content phase.
prerequisites: |
  - Basic familiarity with Git and the command line.
  - No prior Cogitave experience required.
