metadata:
  title: Cogitave engineering standards
  description: Learn the non-negotiable engineering floor every Cogitave contributor and agent works to - the AGENTS floor, naming, commits and versioning, testing and quality, API design, configuration, secure SDLC, CI/CD, and observability and reliability.
  ms.date: 2026-06-28
  author: cogitave
