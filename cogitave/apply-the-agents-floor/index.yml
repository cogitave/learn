uid: cogitave.learn.apply-the-agents-floor
metadata:
  title: Apply a non-negotiable floor
  description: An AI-native org needs a small, non-negotiable floor that every human and agent obeys. Learn the pattern through Cogitave's floor - seven rules in its root AGENTS.md, from English-only to the human gate as an exception handler - and what enforces each.
  ms.date: 2026-07-26
  author: cogitave
  ms.topic: module
title: Apply a non-negotiable floor
summary: An AI-native org runs on a small floor every human and agent obeys. Study Cogitave's floor - its seven non-negotiable rules and what enforces each, from a commit-msg hook to policy-as-code - then apply a floor like it to your own first change.
abstract: |
  By the end of this module, you'll be able to:
  - Explain why an AI-native org needs a small, non-negotiable floor that every contributor and agent inherits, and read Cogitave's seven-rule floor as the worked example.
  - Say what can enforce each kind of rule - a commit-msg hook, a CI gate, an org ruleset, or policy-as-code - not just the rule itself.
  - Treat a root AGENTS.md as the single source of truth and follow it to the owning standard for the detail.
  - Apply the floor to your own first change: sign it, name it as a Conventional Commit, update its docs, and stay inside your grant.
prerequisites: |
  - Basic familiarity with Git and the command line.
  - No prior Cogitave experience required.
