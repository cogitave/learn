title: "Get started with Cogitave Massar"
summary: |
  Massar is the guardian agent that lets an authorized Cogitave operator open an audited terminal session on a customer device with no inbound port and no VPN. Understand the dial-out security model and how a session is bridged, then install, verify, and cleanly remove the agent on Linux and Windows using the real installers.
prerequisites: |
  - Comfort with a Linux or Windows command line and administering a host.
  - No prior Cogitave, Rust, or agent experience required.
