title: Operate the estate
summary: |
  Learn to operate the Cogitave estate safely and auditably: work the propose-only request lifecycle, run agentic operations, apply reliability and SRE practice, respond to incidents, and stand up Day 1 operations. By the end you'll be able to keep the estate running under least privilege with every action recorded as evidence. Day 0: this path is scaffolded - the module bodies are authored in a later content phase.
prerequisites: |
  - Completion of the "Cogitave engineering standards" and "Build on Cogitave Core" paths is recommended.
