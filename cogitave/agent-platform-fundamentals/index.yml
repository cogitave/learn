summary: |
  Learn the two halves of the Cogitave agent platform: the Yuva operating system that runs agents and the Namzu kernel that builds them. By the end you'll understand the runtime, build a minimal MCP-native agent, and run it under a least-privilege capability model.
prerequisites: |
