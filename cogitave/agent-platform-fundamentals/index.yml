uid: cogitave.learn.paths.agent-platform-fundamentals
metadata:
  title: Agent platform fundamentals
  description: Build with the Namzu agent kernel, then understand the sovereign kernel Cogitave is building underneath it - the layer you can use today and the layer meant to enforce its guarantees.
  ms.date: 2026-07-26
  author: cogitave
  ms.topic: learning-path
title: Agent platform fundamentals
summary: |
  Start where you can build: install the Namzu agent kernel, register a model provider, make your first call, and declare a tool with an explicit authority. Then step down a layer to Yuva, the sovereign kernel Cogitave is building to enforce those declarations on hardware it controls - including an honest account of what Yuva cannot do yet.
prerequisites: |
  - Basic familiarity with the command line and TypeScript.
  - Node.js 20 or later, if you want to run the exercise rather than read it.
  - No prior agent, kernel, or Rust experience required.
