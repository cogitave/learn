title: Build your first agent with Namzu
summary: Build a minimal MCP-native agent with the Namzu kernel — one tool, one resource, a declared capability boundary — and run it on Yuva.
abstract: |
  By the end of this module, you'll be able to:
  - Explain how the Namzu agent kernel relates to the Yuva agent operating system.
  - Build a minimal Namzu agent that exposes an MCP tool and resource.
  - Declare an agent's identity, capabilities, and sandbox boundaries.
  - Run your agent on Yuva over stdio or Streamable HTTP, and gate it with evals.
prerequisites: |
  - Completion of the "Get started with Yuva" module.
  - Basic familiarity with TypeScript.
