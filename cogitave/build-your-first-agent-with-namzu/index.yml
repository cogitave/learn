  title: Build your first agent with Namzu
  description: Install the Namzu agent kernel, register a model provider, make your first call, and declare a tool with a typed input schema and an explicit authority. Runs locally on Node with no account required.
  ms.date: 2026-07-26
  author: cogitave
  ms.topic: module
title: Build your first agent with Namzu
summary: Install the Namzu kernel, register a provider, make your first model call, and declare a tool with a typed schema and an explicit authority - locally, with no account.
abstract: |
  By the end of this module, you'll be able to:
  - Explain what an agent kernel owns and what it deliberately refuses to own.
  - Register a model provider, and change vendor without touching your agent code.
  - Read the uniform response shape every provider driver returns.
  - Declare a tool with `defineTool` - its schema, permissions, and safety properties.
prerequisites: |
  - Node.js 20 or later, and TypeScript 5.5 or later.
  - Basic familiarity with TypeScript. No prior agent experience required.
