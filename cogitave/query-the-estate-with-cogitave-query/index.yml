title: Query the estate with Cogitave Query
summary: Learn how Cogitave Query resolves a request against the canonical graph - lexical BM25 and dense HNSW vectors fused by Reciprocal Rank Fusion, a graph-aware rerank and ranking signals, and the bounded, read-only query_graph profile agents call directly.
abstract: |
  By the end of this module, you'll be able to:
  - Explain why Cogitave Query fuses lexical, dense, and graph signals instead of relying on any one retriever alone.
  - Trace a query through the pipeline: BM25 recall, HNSW dense recall, Reciprocal Rank Fusion, and graph-aware rerank.
  - State why Reciprocal Rank Fusion was chosen over a weighted linear combination of retriever scores.
  - Read the bounded `query_graph` contract well enough to explain what makes it safe for an agent to call directly.
prerequisites: |
  - Familiarity with Cogitave Core's canonical property graph - the node/edge model every query resolves against - is assumed.
  - Recommended: @cogitave.learn.core-model-fundamentals, the first module of this path, which covers that graph substrate directly.
