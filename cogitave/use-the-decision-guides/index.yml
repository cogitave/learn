uid: cogitave.learn.use-the-decision-guides
metadata:
  title: Use the decision guides
  description: How an AI-native org's technology-selection decision guides work - a stated default, a real decision tree, and an ADR-gated deviation rule for database, infrastructure, and model selection - and how to walk one to a justified choice.
  ms.date: 2026-07-26
  author: cogitave
  ms.topic: module
title: Use the decision guides
summary: Learn the shared shape behind an AI-native org's database-selection, infrastructure-selection, and model-selection guides - a default, a decision tree, and an ADR-gated deviation rule - and walk a real workload to a justified, recorded choice.
abstract: |
  By the end of this module, you'll be able to:
  - Explain the three-layer guidance model from ADR-0021 - selection, radar, domain - and where the decision guides sit in it.
  - State the shared shape every decision guide follows: a default, a walkable decision tree, and a deviation rule gated on a measured need and an ADR.
  - Walk the database-selection and infrastructure-selection decision trees for a real workload to the guide's prescribed answer.
  - Explain the model-selection guide's "most capable first, optimize down with evidence" posture and when escalating or descending a tier needs an eval or an ADR.
  - Recognize when a choice is the ratified default and needs nothing recorded, versus when it is a deviation that must cite a measured ceiling in an ADR.
prerequisites: |
  - Completion of "Inherit the project baseline", or familiarity with the reuse-first / discover-before-generate posture.
  - Basic familiarity with the technology radar's Adopt/Trial/Assess/Hold rings is helpful but not required.
